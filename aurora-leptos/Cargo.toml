[package]
# Published under the org-prefixed name so we only claim colliery-io-* space on
# crates.io's flat namespace; the lib keeps the ergonomic `aurora_leptos` import.
name = "colliery-io-aurora"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Aurora — Colliery's design system for Leptos, with light and dark themes: the core that control-plane apps are built from (components, tokens, stylesheet)."
repository = "https://github.com/colliery-io/aurora-dark"

# Ship the stylesheet with the crate so build.rs can emit it (write_css) and the
# CSS consts are available.
# `src/**/*.css` matters: the `hlin` module embeds a stylesheet next to itself
# with include_str!, and `src/**/*.rs` does not match it. Without this the crate
# publishes, and then fails to build for anyone who turns the feature on.
include = ["src/**/*.rs", "src/**/*.css", "style/*.css", "README.md", "PATTERNS.md"]

[lib]
name = "aurora_leptos"

[features]
# `components` (default) pulls leptos + the UI. Disable it (default-features=false)
# for a tiny, leptos-free build that still exposes `write_css` + the CSS consts —
# use that in [build-dependencies] to emit a normal stylesheet at build time.
default = ["components"]
components = [
    "dep:leptos",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    # Theme: set data-theme on <html>, store the choice, watch the OS setting.
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/HtmlElement",
    "web-sys/CssStyleDeclaration",
    "web-sys/Storage",
    "web-sys/MediaQueryList",
    "web-sys/EventTarget",
    # Frame: focus traps, Escape, arrow keys, the narrow-screen drawer.
    "web-sys/KeyboardEvent",
    "web-sys/MouseEvent",
    "web-sys/Node",
    "web-sys/NodeList",
    "web-sys/DomRectList",
    "web-sys/HtmlButtonElement",
    "web-sys/HtmlDivElement",
    # CopyButton: copy a link (the page origin).
    "web-sys/Location",
]

# Makes this crate a design pack for Hlin: a module implementing `DesignPack`,
# so a Hlin front end can be drawn with Aurora. Off by default and additive —
# with it off, this crate has no idea Hlin exists and nothing about the default
# build changes, which is why the two extra `web-sys` features it needs are
# named here rather than on the dependency itself.
hlin = [
    "dep:hlin-view",
    "dep:serde_json",
    "components",
    "web-sys/Element",
    "web-sys/DomRect",
]

# Builds the leptos-free `aurora-css` helper binary (for build hooks).
bin = []

# `aurora-css <dir>` writes <dir>/aurora.css. Only built with `--features bin`,
# so normal dependency builds skip it. Run it from a trunk pre_build hook.
[[bin]]
name = "aurora-css"
required-features = ["bin"]

[dependencies]
# Renderer-agnostic; the consuming binary selects csr/hydrate/ssr. Optional so the
# build-script use (write_css) doesn't compile leptos for the host.
leptos = { version = "0.8", default-features = false, optional = true }
# Clipboard copy button.
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"], optional = true }
# "Time ago" / freshness helpers (Date.now) for the data-display widgets.
js-sys = { version = "0.3", optional = true }
# CopyButton waits for the Clipboard promise, and confirms only on success.
wasm-bindgen-futures = { version = "0.4", optional = true }

# Hlin's rendering vocabulary, for the `hlin` feature. Taken without its default
# features: a design pack draws envelopes and never computes a contract
# fingerprint, so it needs none of the hashing half.
hlin-view = { version = ">=0.0.1, <0.2", default-features = false, optional = true }
# Envelopes are JSON documents; `raw` shows one and `stat` reads a value out of
# one. Only needed by the `hlin` feature.
serde_json = { version = "1", optional = true }

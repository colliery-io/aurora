# Generate the Aurora stylesheet before trunk processes assets, so the
# <link> in index.html resolves. Dogfoods aurora_leptos::write_css (via the
# leptos-free `aurora-css` bin). `-p colliery-io-aurora` works because this
# gallery is a workspace member; an external consumer would `cargo install` the
# bin (or use cargo-leptos + build.rs). See the crate README.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = [
  "run", "-q", "-p", "colliery-io-aurora",
  "--no-default-features", "--features", "bin",
  "--bin", "aurora-css",
  # Separate target dir so generating the CSS can't churn trunk's wasm build.
  "--target-dir", "target/_aurora_css",
  "--", "style",
]
